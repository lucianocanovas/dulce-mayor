<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Catálogo — Dulce Mayor</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css(v=2)}">
</head>
<body>
    <header th:replace="~{fragments/chat-widget :: siteHeader}"></header>

    <div class="container">
        <h1 class="section-title">Catálogo Mayorista de Productos</h1>

        <!-- Search Bar -->
        <form th:action="@{/catalog}" method="get" style="max-width: 600px; margin: 0 auto 2.5rem; display: flex; gap: 0.5rem;">
            <input type="text" name="search" th:value="${search}" placeholder="Buscar por golosina, marca o código..." style="flex: 1; padding: 0.75rem 1rem; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.95rem; background: #fff; outline: none;">
            <button type="submit" class="btn btn-primary">Buscar</button>
        </form>

        <div th:if="${#lists.isEmpty(products)}" style="text-align: center; padding: 3rem; color: var(--muted);">
            <p>No se encontraron productos disponibles en el catálogo en este momento.</p>
        </div>

        <div class="grid" th:unless="${#lists.isEmpty(products)}">
            <div th:each="prod : ${products}" class="product-card">
                <span th:if="${prod.onSale}" class="badge-sale">OFERTA</span>
                <div class="dm-card-media">
                    <img th:if="${prod.imageUrl != null and !#strings.isEmpty(prod.imageUrl)}"
                         th:src="${prod.imageUrl}" th:alt="${prod.name}"
                         onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';" />
                    <div class="dm-card-media-placeholder"
                         th:style="${prod.imageUrl != null and !#strings.isEmpty(prod.imageUrl)} ? 'display:none;' : 'display:flex;'">
                        🍬
                    </div>
                </div>
                <span class="product-code" th:text="${prod.code}">COD</span>
                <h3 class="product-title" th:text="${prod.name}">Nombre</h3>
                <p class="product-desc" th:text="${prod.description}">Descripción...</p>
                <div class="product-pack" th:text="${prod.packaging}">Pack</div>
                <div class="product-price" th:text="'$' + ${#numbers.formatDecimal(prod.currentPrice, 0, 'POINT', 0, 'COMMA')}">$0</div>
                <div class="product-unit-price" th:if="${prod.unitsPerPack > 1}"
                     th:text="'$' + ${#numbers.formatDecimal(prod.currentPrice / prod.unitsPerPack, 1, 'POINT', 2, 'COMMA')} + ' c/u (' + ${prod.unitsPerPack} + ' u./bulto)'">
                    $0 c/u
                </div>
                <div style="margin-top: 0.75rem;">
                    <span th:class="${prod.currentStock <= 20} ? 'stock-pill stock-pill--warning' : 'stock-pill'"
                          th:text="${prod.currentStock <= 20}
                            ? ('¡Últimos ' + ${prod.currentStock} + (${prod.currentStock == 1} ? ' bulto!' : ' bultos!'))
                            : (${prod.currentStock} + (${prod.currentStock == 1} ? ' bulto disponible' : ' bultos disponibles'))">En Stock</span>
                </div>
                <div class="dm-card-actions" th:if="${currentCustomer != null}">
                    <input type="number" class="dm-card-qty-input" value="1" min="1" th:max="${prod.currentStock}" />
                    <button type="button" class="dm-add-btn"
                            th:attr="data-id=${prod.id},data-code=${prod.code},data-name=${prod.name},data-price=${prod.currentPrice},data-stock=${prod.currentStock},data-packaging=${prod.packaging}">
                        + Agregar al Carrito
                    </button>
                </div>
                <div class="dm-card-actions dm-card-actions--guest" th:if="${currentCustomer == null}">
                    <a th:href="@{/login}" class="dm-login-to-order">Iniciá sesión para pedir</a>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/chat-widget :: siteFooter}"></footer>

    <script th:src="@{/js/cart.js}"></script>
    <div th:replace="~{fragments/chat-widget :: aiChatWidget}"></div>
</body>
</html>
