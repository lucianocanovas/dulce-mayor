<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Contacto &amp; Sucursales — Dulce Mayor</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/chat-widget :: siteHeader}"></header>

    <div class="container" style="max-width: 800px;">
        <h1 class="section-title">Sucursales y Canales de Atención</h1>
        <div class="product-card" style="padding: 2.5rem; gap: 1rem;">
            <h3 style="font-size: 1.4rem; color: var(--rust);">Sede Central Mendoza</h3>
            <p><strong>Dirección:</strong> Av. San Martín 1500, Ciudad de Mendoza (CP 5500)</p>
            <p><strong>Teléfono:</strong> +54 9 261 555-1234</p>
            <p><strong>Correo Corporativo:</strong> ventas@dulcemayor.com.ar</p>
            <p><strong>Horario de Atención Mayorista:</strong> Lunes a Viernes de 08:00 a 17:00 hs.</p>
        </div>
    </div>

    <footer>
        <p><strong>Dulce Mayor S.A.</strong> — Mendoza, Argentina</p>
    </footer>

    <script th:src="@{/js/cart.js}"></script>
    <div th:replace="~{fragments/chat-widget :: aiChatWidget}"></div>
</body>
</html>
