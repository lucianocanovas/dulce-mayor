<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Crear Cuenta — Dulce Mayor</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css(v=2)}">
</head>
<body>
    <header th:replace="~{fragments/chat-widget :: siteHeader}"></header>

    <div class="dm-auth-container" style="max-width: 640px;">
        <div class="dm-panel">
            <h1 class="section-title" style="margin-bottom: 0.4rem;">Crear Cuenta Mayorista</h1>
            <p style="font-size: 0.9rem; color: var(--muted); margin-bottom: 1.25rem;">
                Registrate para guardar tus datos de envío, seguir todos tus pedidos y obtener presupuestos personalizados con IA.
            </p>

            <div th:if="${error}" class="dm-alert-error" th:text="${error}">Error</div>
            <div id="dm-google-error" class="dm-alert-error" style="display:none;"></div>

            <button type="button" id="dm-google-login-btn" class="btn btn-outline"
                    th:attr="data-auth0-domain=${auth0Domain},data-auth0-client-id=${auth0ClientId}"
                    style="width:100%; display:flex; align-items:center; justify-content:center; gap:0.6rem; font-weight:600; background:#fff; margin-bottom:0.75rem;">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continuar con Google</span>
            </button>

            <div style="display:flex; align-items:center; gap:0.75rem; margin:0.75rem 0 1rem; color:var(--muted); font-size:0.8rem;">
                <div style="flex:1; height:1px; background:var(--border);"></div>
                <span>o completá tus datos</span>
                <div style="flex:1; height:1px; background:var(--border);"></div>
            </div>

            <form th:action="@{/register}" method="post" class="dm-form-grid">
                <div class="dm-field">
                    <label for="firstName">Nombre *</label>
                    <input id="firstName" type="text" name="firstName" th:value="${firstName}" required />
                </div>
                <div class="dm-field">
                    <label for="lastName">Apellido *</label>
                    <input id="lastName" type="text" name="lastName" th:value="${lastName}" required />
                </div>
                <div class="dm-field">
                    <label for="email">Correo Electrónico *</label>
                    <input id="email" type="email" name="email" th:value="${email}" placeholder="cliente@kiosco.com" required />
                </div>
                <div class="dm-field">
                    <label for="password">Contraseña (mín. 6 caracteres) *</label>
                    <input id="password" type="password" name="password" minlength="6" required />
                </div>
                <div class="dm-field">
                    <label for="storeName">Nombre del Comercio / Kiosco</label>
                    <input id="storeName" type="text" name="storeName" th:value="${storeName}" placeholder="Ej: Kiosco El Sol" />
                </div>
                <div class="dm-field">
                    <label for="phone">Teléfono / WhatsApp</label>
                    <input id="phone" type="text" name="phone" th:value="${phone}" placeholder="+54 9 261 ..." />
                </div>
                <div class="dm-field">
                    <label for="taxIdOrDni">DNI o CUIT</label>
                    <input id="taxIdOrDni" type="text" name="taxIdOrDni" th:value="${taxIdOrDni}" />
                </div>
                <div class="dm-field">
                    <label for="deliveryCity">Ciudad / Departamento</label>
                    <input id="deliveryCity" type="text" name="deliveryCity" th:value="${deliveryCity ?: 'Capital'}" />
                </div>
                <div class="dm-field">
                    <label for="deliveryAddress">Dirección de Entrega</label>
                    <input id="deliveryAddress" type="text" name="deliveryAddress" th:value="${deliveryAddress}" placeholder="Av. San Martín 1234" />
                </div>
                <div class="dm-field">
                    <label for="deliveryNeighborhood">Barrio</label>
                    <input id="deliveryNeighborhood" type="text" name="deliveryNeighborhood" th:value="${deliveryNeighborhood}" placeholder="Centro" />
                </div>
                <div style="grid-column: 1 / -1; margin-top: 0.5rem;">
                    <button type="submit" class="btn btn-primary" style="width:100%;">Registrarme y Comenzar</button>
                </div>
            </form>

            <div style="margin-top: 1.15rem; font-size: 0.85rem; color: var(--muted); text-align:center;">
                ¿Ya tenés cuenta? <a th:href="@{/login}" style="color: var(--primary); font-weight: 700;">Ingresá acá</a>
            </div>
        </div>
    </div>

    <footer>
        <p><strong>Dulce Mayor S.A.</strong> — Portal de Clientes Mayoristas</p>
    </footer>

    <script th:src="@{/js/cart.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/@auth0/auth0-spa-js@2/dist/auth0-spa-js.production.min.js"></script>
    <script th:src="@{/js/google-auth.js}"></script>
    <div th:replace="~{fragments/chat-widget :: aiChatWidget}"></div>
</body>
</html>
