# ==============================================================================
# Dulce Mayor Server — Production Profile (Docker / VPS DonWeb)
# ==============================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.h2.console.enabled=false

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/dulcemayor}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:dulcemayor}
spring.datasource.password=${DB_PASSWORD:dulcemayor}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

