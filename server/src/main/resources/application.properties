spring.application.name=dulcemayor
spring.config.import=optional:file:.env[.properties],optional:file:server/.env[.properties]
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dulcemayor}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USER:dulcemayor}
spring.datasource.password=${DB_PASSWORD:dulcemayor}
spring.h2.console.enabled=false

# Mercado Pago Configuration
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.sandbox.enabled=${MERCADOPAGO_SANDBOX_ENABLED:true}

# Public Application URLs (used for back_urls, webhooks & CORS)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:8081}
app.central-url=${APP_CENTRAL_URL:http://localhost:5173}
app.order-url=${APP_ORDER_URL:http://localhost:5174}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Bank Transfer Configuration (TPI N2)
payment.bank.alias=${PAYMENT_BANK_ALIAS:DULCE.MAYOR.MZA}
payment.bank.cbu=${PAYMENT_BANK_CBU:0000003100084920193842}
payment.bank.holder=${PAYMENT_BANK_HOLDER:Dulce Mayor S.A.}

# Optional Email Notifications (SMTP)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@dulcemayor.com.ar}
app.mail.sender-name=${MAIL_SENDER_NAME:Dulce Mayor Mendoza}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}

# Google Gemini AI Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
