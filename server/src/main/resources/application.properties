spring.application.name=dulcemayor
spring.config.import=optional:file:.env[.properties],optional:file:server/.env[.properties]

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 In-Memory Database (Default for dev/testing)
spring.datasource.url=jdbc:h2:mem:dulcemayordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Mercado Pago Configuration
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.sandbox.enabled=${MERCADOPAGO_SANDBOX_ENABLED:true}

# Application Base URLs (used for back_urls & webhook notifications)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:8081}
app.central-url=${APP_CENTRAL_URL:http://localhost:5173}
app.order-url=${APP_ORDER_URL:http://localhost:5174}

# Bank Transfer Configuration (TPI N2)
payment.bank.alias=${PAYMENT_BANK_ALIAS:DULCE.MAYOR.MZA}
payment.bank.cbu=${PAYMENT_BANK_CBU:0000003100084920193842}
payment.bank.holder=${PAYMENT_BANK_HOLDER:Dulce Mayor S.A.}

# Optional Email Notifications (SMTP)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@dulcemayor.com.ar}

# Google Gemini AI Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
